<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stickman Duel</title>
    <style>
      html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; background: #111; }
      iframe { display: block; }
    </style>
  </head>
  <body>
    <iframe id="game" title="Stickman Duel" allow="fullscreen; autoplay; encrypted-media" allowfullscreen></iframe>
    <script>
      fetch('/api/status').then((response) => response.json()).then(({ cache }) => {
        if (cache?.gameUrl) document.getElementById('game').src = cache.gameUrl;
      });
    </script>
  </body>
</html>
